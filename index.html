<title>동그란 말 공감 교실</title>
<style>
/*
VOICE  : 따뜻하고 차분한 수업 도구. 학생에게는 쉽고, 선생님에게는 한눈에.
IDEA   : 수업 전과 후를 나란히 놓고 보는 "마음 일기장".
PICTURE: 전·후를 짝지은 막대, 얼굴 다섯 칸, 큰 평균 숫자.
COLOUR : 청록(공감) 중심 + 산호(수업 전) · 청록(수업 후) 두 색으로 비교.
TYPE   : 시스템 한글 글꼴, 숫자는 굵게 크게.
LAYOUT : 한 줄 흐름, 휴대폰 먼저.
*/
:root{--bg:#f4f8f8;--card:#fff;--ink:#17323a;--sub:#5b7179;--line:#dbe6e8;--teal:#16867f;--teal2:#d6efed;--coral:#e8735a;--coral2:#fbe2dc;--warn:#b54a2f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;word-break:keep-all;overflow-x:clip}
header{background:var(--teal);color:#fff;padding:14px max(4vw,16px)}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{max-width:960px;margin:0 auto;padding:18px max(4vw,14px) 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--sub);font-size:14px}
.todo{background:#fff8e6;border:1px solid #f1dc9c;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer;background:var(--teal);color:#fff;font-weight:700}
button.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
button.warn{background:#fff;color:var(--warn);border:1.5px solid var(--warn)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:80px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.banner{background:#fff3d6;border-bottom:1px solid #f0d791;padding:8px max(4vw,16px);font-size:14px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.face{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;color:var(--ink);font-weight:400;min-height:auto}
.face b{display:block;font-size:30px;line-height:1.2}
.face span{font-size:12px}
.face.on{border-color:var(--teal);background:var(--teal2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;color:var(--ink);font-weight:400}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:700}
.q small{color:var(--teal);font-weight:700;display:block;font-size:12px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:400;padding:6px 2px;font-size:13px;line-height:1.25}
.scale button b{display:block;font-size:18px}
.scale button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.tile b{display:block;font-size:clamp(24px,5vw,34px);line-height:1.1}
.tile span{font-size:13px;color:var(--sub)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:15px;margin:4px 0 10px}
.big b{font-size:clamp(28px,6vw,40px)}
.pre{color:var(--coral)}.post{color:var(--teal)}
.delta{font-weight:800;padding:2px 10px;border-radius:999px;background:var(--teal2);color:var(--teal);font-size:15px}
.delta.down{background:var(--coral2);color:var(--warn)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin:0 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.bar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:8px;align-items:center}
.bar>div:first-child{font-size:14px}
.pair{display:grid;gap:3px}
.track{height:14px;background:#eef3f4;border-radius:7px;position:relative}
.fill{height:100%;border-radius:7px}
.fill.pre{background:var(--coral)}.fill.post{background:var(--teal)}
.val{font-size:12px;color:var(--sub);white-space:nowrap}
.trk{display:grid;grid-template-columns:minmax(0,1fr) 3.4em;gap:6px;align-items:center}
.split{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:13px;color:#fff;font-weight:700}
.split div{display:flex;align-items:center;justify-content:center;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px}
td.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.roomlist{display:grid;gap:8px}
.room{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.room b{font-size:16px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--sub);margin-left:6px}
.tag.on{background:var(--teal2);color:var(--teal)}
.qrbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.qrbox svg{width:150px;height:150px;display:block}
.code{font-size:28px;font-weight:800;letter-spacing:3px}
.seg{display:inline-flex;border:1.5px solid var(--teal);border-radius:10px;overflow:hidden}
.seg button{border-radius:0;background:#fff;color:var(--teal);min-height:40px;padding:8px 14px}
.seg button.on{background:var(--teal);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,30,35,.55);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:520px;width:100%;margin:0}
.full{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:9;text-align:center;padding:20px}
.full svg{width:min(70vmin,520px);height:min(70vmin,520px)}
.done{text-align:center;padding:30px 10px}
.done b{font-size:46px;display:block}
.foot{text-align:center;font-size:12px;color:#8a9a9f;margin:20px 0}
.hide{display:none!important}
.sharp{background:#fdeeec;border:1.5px solid #f0c4b9;border-radius:14px;padding:14px 16px}
.sharp small{font-weight:800;color:#a03f2d;display:block;font-size:12px}
.sharp p{margin:2px 0 0;font-size:18px;font-weight:800;color:#8a3a26}
.gain{background:#eefaf3;border:1.5px solid #bfe6d2;border-radius:12px;padding:12px 14px;margin-top:12px;color:#1d6b48;font-size:15px}
.tipbox{background:#fff8e8;border:1.5px solid #edd9a8;border-radius:12px;padding:12px 14px;margin-top:10px;color:#7a5c1e;font-size:15px}
.samp{background:#f4f7f7;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.gain ul,.tipbox ul{margin:4px 0 0;padding-left:18px}
.prog{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}.prog div{height:100%;background:var(--teal)}
.quote{border-left:3px solid var(--teal);padding:4px 10px;margin:6px 0;font-size:15px}
@media(max-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.qrbox{grid-template-columns:1fr}.qrbox svg{margin:0 auto}.bar{grid-template-columns:1fr}.face span{font-size:11px}}
@media print{header,.noprint,button{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#ccc}}
</style>
</head>

  const save = d => { store.set(DEMO_KEY, d); subs.forEach(f => f()); };
  addEventListener('storage', e => { if (e.key === DEMO_KEY) subs.forEach(f => f()); });
  const watch = fn => { subs.add(fn); fn(); return () => subs.delete(fn); };
  return {
    demo: true, user: { uid: 'demo', name: '체험 선생님' },
    onAuth(cb) { cb(this.user); }, async signIn() { }, async signOut() { },
    listRooms(uid, cb) { return watch(() => { const d = load(); cb(Object.entries(d.rooms).map(([id, r]) => ({ id, ...r })).sort((a, b) => b.createdAt - a.createdAt)); }); },
    async createRoom(title, school) { const d = load(); const id = 'r' + Date.now(); const code = newCode(c => d.codes[c]); d.rooms[id] = { owner: 'demo', title, school, code, open: true, phase: 'pre', createdAt: Date.now() }; d.codes[code] = { roomId: id, owner: 'demo', open: true, phase: 'pre', title, school }; d.resp[id] = []; save(d); return { id, code }; },
    async updateRoom(room, patch) { const d = load(); Object.assign(d.rooms[room.id], patch); Object.assign(d.codes[room.code], patch); save(d); },
    async deleteRoom(room) { const d = load(); delete d.rooms[room.id]; delete d.codes[room.code]; delete d.resp[room.id]; save(d); },
    async findCode(code) { return load().codes[code] || null; },
    watchCode(code, cb) { return watch(() => cb(load().codes[code] || null)); },
    async addResponse(roomId, data) { const d = load(); if (!d.rooms[roomId] || !d.rooms[roomId].open) return { ok: false, reason: '수업이 닫혀 있어요.' }; (d.resp[roomId] ||= []).push({ id: 'x' + Math.random().toString(36).slice(2), ...data, createdAt: Date.now() }); save(d); return { ok: true }; },
    watchResponses(roomId, cb) { return watch(() => cb(load().resp[roomId] || [])); },
    async addSample(roomId) {
      const d = load(); const list = d.resp[roomId] ||= []; const now = Date.now();
      const r = (lo, hi) => Math.max(1, Math.min(5, Math.round(lo + Math.random() * (hi - lo))));
      for (let c = 1; c <= 2; c++) for (let n = 1; n <= 12; n++) {
        const cls = '2-' + c, base = 2 + Math.random() * 1.6;
        const pre = ITEMS.map(() => r(base - .8, base + .8)), moodPre = r(1.6, 3.8);
        list.push({ id: 's' + c + n + 'a', phase: 'pre', classNo: cls, studentNo: n, displayName: '', mood: moodPre, moodWord: WORDS[Math.floor(Math.random() * WORDS.length)], items: pre, note: '', createdAt: now - 3600e3 });
        { const h = Object.fromEntries(RW_RULES.map(x => [x.key, Math.floor(Math.random() * 6) + 2])); const sc = Object.values(h).reduce((a, b) => a + b, 0) * 20; list.push({ id: 's' + c + n + 'm', phase: 'activity', classNo: cls, studentNo: n, displayName: '', score: Math.min(sc, 800), hits: h, answers: RW.map(x => x.sample), createdAt: now - 1800e3 }); }
        if (Math.random() < .92) list.push({ id: 's' + c + n + 'b', phase: 'post', classNo: cls, studentNo: n, displayName: '', mood: r(moodPre - .4, moodPre + 1.6), moodWord: ['편안함', '뿌듯함', '기쁨', '설렘', '그저 그럼'][Math.floor(Math.random() * 5)], items: pre.map(v => r(v - .3, v + 1.4)), note: '', createdAt: now });
      }
      save(d);
    }
  };
}
function newCode(exists) { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c; do { c = Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join(''); } while (exists(c)); return c; }

async function firebaseDB(cfg) {
  const V = '10.12.2', B = `https://www.gstatic.com/firebasejs/${V}/`;
  const { initializeApp } = await import(B + 'firebase-app.js');
  const F = await import(B + 'firebase-firestore.js');
  const A = await import(B + 'firebase-auth.js');
  const fapp = initializeApp(cfg), db = F.getFirestore(fapp), auth = A.getAuth(fapp);
  await A.setPersistence(auth, A.browserSessionPersistence); // 브라우저를 닫으면 로그아웃(학교 공용 PC 보호)
  A.getRedirectResult(auth).catch(() => { });
  return {
    demo: false, user: null,
    onAuth(cb) { A.onAuthStateChanged(auth, u => { this.user = u ? { uid: u.uid, name: u.displayName || u.email } : null; cb(this.user); }); },
    async signIn() { const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); try { await A.signInWithPopup(auth, p); } catch (e) { if (e.code === 'auth/popup-blocked') await A.signInWithRedirect(auth, p); else throw e; } },
    async signOut() { await A.signOut(auth); },
    listRooms(uid, cb) { return F.onSnapshot(F.query(F.collection(db, 'consultRooms'), F.where('owner', '==', uid)), s => cb(s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => ts(b) - ts(a))), e => modal('수업 목록을 읽지 못했어요: ' + esc(e.code || e.message))); },
    async createRoom(title, school) {
      let code; for (let i = 0; i < 6; i++) { code = newCode(() => false); const s = await F.getDoc(F.doc(db, 'consultCodes', code)); if (!s.exists()) break; }
      const ref = F.doc(F.collection(db, 'consultRooms')); const b = F.writeBatch(db);
      b.set(ref, { owner: auth.currentUser.uid, title, school, platform: 'consult', app: 'round-words-empathy', code, open: true, phase: 'pre', createdAt: F.serverTimestamp() });
      b.set(F.doc(db, 'consultCodes', code), { roomId: ref.id, owner: auth.currentUser.uid, open: true, phase: 'pre', title, school });
      await b.commit(); return { id: ref.id, code };
    },
    async updateRoom(room, patch) { const b = F.writeBatch(db); b.update(F.doc(db, 'consultRooms', room.id), patch); b.update(F.doc(db, 'consultCodes', room.code), patch); await b.commit(); },
    async deleteRoom(room) {
      const s = await F.getDocs(F.collection(db, 'consultRooms', room.id, 'responses'));
      for (let i = 0; i < s.docs.length; i += 400) { const b = F.writeBatch(db); s.docs.slice(i, i + 400).forEach(x => b.delete(x.ref)); await b.commit(); }
      const b = F.writeBatch(db); b.delete(F.doc(db, 'consultRooms', room.id)); b.delete(F.doc(db, 'consultCodes', room.code)); await b.commit();
    },
    async findCode(code) { const s = await F.getDoc(F.doc(db, 'consultCodes', code)); return s.exists() ? s.data() : null; },
    watchCode(code, cb) { return F.onSnapshot(F.doc(db, 'consultCodes', code), s => cb(s.exists() ? s.data() : null), () => cb(null)); },
    async addResponse(roomId, data) { try { await F.addDoc(F.collection(db, 'consultRooms', roomId, 'responses'), { ...data, createdAt: F.serverTimestamp() }); return { ok: true }; } catch (e) { return { ok: false, reason: e.code === 'permission-denied' ? '수업이 닫혀 있거나 보낼 수 없는 내용이에요.' : '인터넷 연결을 확인해 주세요.' }; } },
    watchResponses(roomId, cb) { return F.onSnapshot(F.collection(db, 'consultRooms', roomId, 'responses'), s => cb(s.docs.map(x => ({ id: x.id, ...x.data() }))), e => modal('기록을 읽지 못했어요: ' + esc(e.code || e.message))); }
  };
}

function teacherView() {
  let rooms = [], cur = null, resp = [], offR = null, offL = null, cls = '전체';
  DB.onAuth(u => { if (offL) offL(); if (!u) return renderLogin(); offL = DB.listRooms(u.uid, list => { rooms = list; if (cur) { cur = rooms.find(r => r.id === cur.id) || null; } renderRooms(); if (cur) renderRoomHead(); }); });
  function renderLogin() {
    app.innerHTML = `<div class="card"><h2>선생님 로그인</h2><p>구글 계정으로 로그인하면 수업을 만들고 통계를 볼 수 있어요. 브라우저를 닫으면 자동으로 로그아웃돼요.</p><button id="login">구글로 로그인</button></div>`;
    $('#login').onclick = () => DB.signIn().catch(e => modal('로그인하지 못했어요: ' + esc(e.code || e.message)));
  }
  function shell() {
    if ($('#tv')) return;
    app.innerHTML = `<div id="tv"><div class="card noprint"><div class="row" style="justify-content:space-between"><h2 style="margin:0">내 수업</h2><span class="muted" id="who"></span></div>
      <div class="row" style="margin-top:10px"><input id="schoolIn" maxlength="30" placeholder="학교 이름"><input id="title" maxlength="40" placeholder="수업 이름 (예: 2학년 3반 공감 수업)"><button id="mk" style="flex:0 0 auto">수업 만들기</button></div>
      <div class="roomlist" id="rooms" style="margin-top:12px"></div></div><div id="room"></div></div>`;
    $('#who').innerHTML = `${esc(DB.user.name)} ${DB.demo ? '' : '· <a href="#" id="out">로그아웃</a>'}`;
    if ($('#out')) $('#out').onclick = e => { e.preventDefault(); DB.signOut(); };
    $('#schoolIn').value = store.get('gkc_school', DEFAULT_SCHOOL);
    $('#mk').onclick = async () => { const t = $('#title').value.trim(), sc = $('#schoolIn').value.trim(); if (!sc || !t) return modal('학교 이름과 수업 이름을 적어 주세요.'); store.set('gkc_school', sc); $('#mk').disabled = true; try { const r = await DB.createRoom(t, sc); $('#title').value = ''; openRoom(r.id); } catch (e) { modal('만들지 못했어요: ' + esc(e.code || e.message)); } $('#mk').disabled = false; };
  }
  function renderRooms() {
    shell();
    $('#rooms').innerHTML = rooms.length ? rooms.map(r => `<div class="room"><div><b>${esc(r.title)}</b><span class="tag">${esc(r.school || '')}</span><span class="tag ${r.open ? 'on' : ''}">${r.open ? '열림' : '닫힘'}</span><span class="tag">${PHASE[r.phase]}</span><div class="muted">코드 ${esc(r.code)}</div></div><button class="${cur && cur.id === r.id ? '' : 'ghost'}" data-id="${r.id}" style="flex:0 0 auto">${cur && cur.id === r.id ? '보는 중' : '열어 보기'}</button></div>`).join('') : '<p class="muted">아직 만든 수업이 없어요. 위에서 수업을 만들어 주세요.</p>';
    $('#rooms').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openRoom(b.dataset.id); };
  }
  function openRoom(id) {
    cur = rooms.find(r => r.id === id) || { id }; cls = '전체';
    if (offR) offR(); renderRooms();
    offR = DB.watchResponses(id, list => { resp = list; renderStats(); });
    const wait = () => { cur = rooms.find(r => r.id === id); if (cur) renderRoomHead(); else setTimeout(wait, 200); }; wait();
  }
  function link() { return location.origin + location.pathname + '?code=' + cur.code + (DB.demo ? '&demo' : ''); }
  function qrSvg(text, cell) { if (!window.qrcode) return ''; const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag(cell, 8); }
  function renderRoomHead() {
    if (!$('#room')) return;
    if (!$('#rhead')) $('#room').innerHTML = `<div class="card noprint" id="rhead"></div><div id="stats"></div>`;
    $('#school').textContent = `${cur.school || ''} · 공감 및 정서표현 중심 예술통합 프로그램`;
    $('#rhead').innerHTML = `<h2>${esc(cur.title)} <span class="tag">${esc(cur.school || '')}</span></h2>
      <div class="qrbox"><div>${qrSvg(link(), 4)}</div><div><div class="muted">학생은 QR을 찍거나 코드를 입력해요</div><div class="code">${esc(cur.code)}</div>
      <div class="muted" style="overflow-wrap:anywhere">${esc(link())}</div>
      <div class="row" style="margin-top:8px"><button class="ghost" id="big" style="flex:0 0 auto">QR 크게 보기</button><button class="ghost" id="copy" style="flex:0 0 auto">링크 복사</button></div></div></div>
      <h3>학생 화면 단계 (수업 전 체크 → 동그란 말 연습 → 수업 후 체크)</h3><div class="row"><div class="seg" style="flex:0 0 auto">${['pre', 'activity', 'post'].map(p => `<button data-p="${p}" class="${cur.phase === p ? 'on' : ''}">${p === 'activity' ? '동그란 말 연습' : (p === 'pre' ? '수업 전 체크' : '수업 후 체크')}</button>`).join('')}</div>
      <button class="${cur.open ? 'warn' : ''}" id="tog" style="flex:0 0 auto">${cur.open ? '수업 닫기' : '수업 열기'}</button></div>
      <p class="muted">단계를 바꾸면 학생 화면이 저절로 바뀌어요. 수업이 끝나면 닫아 주세요.</p>
      ${DB.demo ? '<button class="ghost" id="sample">예시 학생 24명 넣어 보기 (체험 모드)</button>' : ''}
      <details style="margin-top:10px"><summary class="muted">수업 지우기</summary><p class="muted">이 수업과 학생 기록을 모두 지워요. 먼저 CSV를 내려받아 두세요.</p><button class="warn" id="del">수업과 기록 모두 지우기</button></details>`;
    document.querySelectorAll('.seg button').forEach(b => b.onclick = () => DB.updateRoom(cur, { phase: b.dataset.p }));
    $('#tog').onclick = () => DB.updateRoom(cur, { open: !cur.open });
    $('#big').onclick = () => { const d = document.createElement('div'); d.className = 'full'; d.innerHTML = `<div><h2>${esc(cur.title)}</h2>${qrSvg(link(), 10)}<div class="code" style="font-size:44px">${esc(cur.code)}</div><button style="margin-top:14px">닫기</button></div>`; document.body.appendChild(d); d.querySelector('button').onclick = () => d.remove(); };
    $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(link()); modal('링크를 복사했어요.'); } catch (e) { modal('복사하지 못했어요. 링크를 길게 눌러 복사해 주세요.'); } };
    if ($('#sample')) $('#sample').onclick = () => DB.addSample(cur.id);
    $('#del').onclick = () => { const m = modal(`<h2>정말 지울까요?</h2><p>지우려면 수업 이름 <b>${esc(cur.title)}</b>을 그대로 적어 주세요.</p><input id="delname"><button class="warn" id="delgo" style="margin-top:10px">지우기</button>`); m.querySelector('#delgo').onclick = async () => { if (m.querySelector('#delname').value.trim() !== cur.title) return; await DB.deleteRoom(cur); m.remove(); if (offR) offR(); cur = null; $('#room').innerHTML = ''; }; };
  }

  /* ---------- 통계 ---------- */
  function latest(list, phase) { const m = new Map(); for (const r of list) { if (r.phase !== phase) continue; const k = r.classNo + '#' + r.studentNo; const o = m.get(k); if (!o || ts(r) >= ts(o)) m.set(k, r); } return m; }
  function pairBar(label, a, b, max, fmt) {
    const w = v => v == null ? 0 : Math.max(0, Math.min(100, v / max * 100));
    return `<div class="bar"><div>${label}</div><div class="pair"><div class="trk"><div class="track"><div class="fill pre" style="width:${w(a)}%"></div></div><span class="val">${fmt(a)}</span></div><div class="trk"><div class="track"><div class="fill post" style="width:${w(b)}%"></div></div><span class="val">${fmt(b)}</span></div></div></div>`;
  }
  const legend = '<div class="legend"><span><i style="background:var(--coral)"></i>수업 전</span><span><i style="background:var(--teal)"></i>수업 후</span></div>';
  const deltaTag = (a, b) => (a == null || b == null) ? '' : `<span class="delta ${b - a < 0 ? 'down' : ''}">${b - a >= 0 ? '▲' : '▼'} ${Math.abs(b - a).toFixed(2)}</span>`;
  function renderStats() {
    if (!$('#stats')) return;
    const classes = [...new Set(resp.map(r => r.classNo))].sort();
    const use = cls === '전체' ? resp : resp.filter(r => r.classNo === cls);
    const P = latest(use, 'pre'), Q = latest(use, 'post');
    const pre = [...P.values()], post = [...Q.values()];
    const ACT = latest(use, 'activity'), act = [...ACT.values()];
    const pairs = [...P.keys()].filter(k => Q.has(k)).map(k => [P.get(k), Q.get(k)]);
    const mPre = avg(pre.map(r => r.mood)), mPost = avg(post.map(r => r.mood));
    const sPre = avg(pre.map(scoreOf)), sPost = avg(post.map(scoreOf));
    const mUp = pairs.filter(([a, b]) => b.mood > a.mood).length, mSame = pairs.filter(([a, b]) => b.mood === a.mood).length, mDown = pairs.length - mUp - mSame;
    const eUp = pairs.filter(([a, b]) => scoreOf(b) > scoreOf(a)).length;
    const dist = (arr, v) => arr.filter(r => r.mood === v).length;
    const wc = (arr, w) => arr.filter(r => r.moodWord === w).length;
    const words = WORDS.filter(w => wc(pre, w) + wc(post, w) > 0).sort((a, b) => (wc(post, b) - wc(pre, b)) - (wc(post, a) - wc(pre, a)));
    const rows = [...new Set([...P.keys(), ...ACT.keys(), ...Q.keys()])].map(k => ({ a: P.get(k), b: Q.get(k), m: ACT.get(k), r: P.get(k) || ACT.get(k) || Q.get(k) })).sort((x, y) => x.r.classNo.localeCompare(y.r.classNo) || x.r.studentNo - y.r.studentNo);
    const moodE = v => v ? MOODS[v - 1].e : '–';
    $('#stats').innerHTML = !resp.length ? `<div class="card"><h2>통계</h2><p class="muted">아직 들어온 기록이 없어요. 학생들이 보내면 여기에 바로 나타나요.</p></div>` : `
      <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">한눈에 보기</h2>
        <div class="row noprint" style="flex:0 0 auto"><select id="cls" style="width:auto">${['전체', ...classes].map(c => `<option ${c === cls ? 'selected' : ''}>${c === '전체' ? '전체' : c + '반'}</option>`).join('')}</select>
        <button class="ghost" id="csv" style="flex:0 0 auto">CSV 내려받기</button><button class="ghost" id="print" style="flex:0 0 auto">인쇄</button></div></div>
        <div class="tiles" style="margin-top:12px"><div class="tile"><b class="pre">${pre.length}</b><span>수업 전 응답</span></div><div class="tile"><b class="post">${post.length}</b><span>수업 후 응답</span></div><div class="tile"><b>${pairs.length}</b><span>전·후 모두 낸 학생</span></div></div><p class="muted">동그란 말 연습 참여 ${act.length}명</p>
        <p class="muted" style="margin-bottom:0">한 학생이 여러 번 내면 마지막 것만 셉니다. 변화(좋아짐·올라감)는 전·후를 모두 낸 학생끼리 비교해요.</p></div>

      <div class="card"><h2>😊 기분 변화</h2>
        <div class="big">평균 <b class="pre">${f1(mPre)}</b> → <b class="post">${f1(mPost)}</b> <span class="muted">/ 5</span> ${deltaTag(mPre, mPost)}</div>
        ${pairs.length ? `<div class="split" title="전·후를 모두 낸 ${pairs.length}명">${[[mUp, '좋아짐', 'var(--teal)'], [mSame, '같음', '#9fb3b8'], [mDown, '낮아짐', 'var(--coral)']].filter(x => x[0]).map(([n, t, c]) => `<div style="width:${pct(n, pairs.length)}%;background:${c}">${t} ${n}명</div>`).join('')}</div><p class="muted">전·후를 모두 낸 ${pairs.length}명 중 <b>${pct(mUp, pairs.length)}%</b>의 기분이 좋아졌어요.</p>` : ''}
        <h3>기분 분포 (명)</h3>${legend}<div class="bars">${MOODS.slice().reverse().map(m => pairBar(`${m.e} ${m.t}`, dist(pre, m.v), dist(post, m.v), Math.max(1, ...MOODS.map(x => Math.max(dist(pre, x.v), dist(post, x.v)))), v => v + '명')).join('')}</div>
        ${words.length ? `<h3>마음 낱말 (명, 늘어난 순)</h3>${legend}<div class="bars">${words.map(w => pairBar(w, wc(pre, w), wc(post, w), Math.max(1, ...words.map(x => Math.max(wc(pre, x), wc(post, x)))), v => v + '명')).join('')}</div>` : ''}
      </div>

      <div class="card"><h2>🤝 공감 변화</h2>
        <div class="big">평균 <b class="pre">${f1(sPre)}</b> → <b class="post">${f1(sPost)}</b> <span class="muted">/ 5</span> ${deltaTag(sPre, sPost)}</div>
        ${pairs.length ? `<p class="muted">전·후를 모두 낸 ${pairs.length}명 중 <b>${pct(eUp, pairs.length)}%</b>의 공감 점수가 올라갔어요.</p>` : ''}
        <h3>영역별 평균</h3>${legend}<div class="bars">${DOMAINS.map((d, i) => pairBar(d, avg(pre.map(r => domainOf(r, i))), avg(post.map(r => domainOf(r, i))), 5, f1)).join('')}</div>
        <h3>문항별 평균</h3>${legend}<div class="bars">${ITEMS.map((it, i) => pairBar(`${i + 1}. ${esc(it.t)}`, avg(pre.map(r => r.items[i])), avg(post.map(r => r.items[i])), 5, f1)).join('')}</div>
        <p class="muted">수업 돌아보기용으로 직접 만든 문항이에요. 표준화된 공감 검사가 아니므로, 학생 수가 적을 때는 차이를 일반화하지 않아요.</p></div>


      <div class="card"><h2>🌈 동그란 말 연습</h2>
        ${act.length ? `<div class="big">참여 <b>${act.length}</b>명 · 문장당 평균 <b class="post">${Math.round(avg(act.map(r => r.score / RW.length)))}</b><span class="muted">/ 100점</span></div>
        <h3>다섯 가지 방법을 쓴 비율</h3><p class="muted">학생들이 바꿔 쓴 문장 전체(${act.length * RW.length}문장) 가운데 각 방법이 들어간 문장의 비율이에요.</p>
        <div class="bars">${RW_RULES.map(r => { const v = pct(act.reduce((a, x) => a + ((x.hits || {})[r.key] || 0), 0), act.length * RW.length); return `<div class="bar"><div>${r.name}</div><div class="trk"><div class="track"><div class="fill post" style="width:${v}%"></div></div><span class="val">${v}%</span></div></div>`; }).join('')}</div>
        <h3>우리가 바꾼 동그란 말 <span class="muted">(이름 없이 화면에 띄워 함께 볼 수 있어요)</span></h3>
        <details><summary class="muted">장면별로 펼쳐 보기</summary>${RW.map((it, i) => `<h3 style="font-size:15px">${i + 1}. ${esc(it.scene)} <span class="muted">"${esc(it.sharp)}"</span></h3>${act.map(r => (r.answers || [])[i]).filter(Boolean).map(t => `<div class="quote">🌈 ${esc(t)}</div>`).join('') || '<p class="muted">아직 없어요.</p>'}`).join('')}</details>` : '<p class="muted">아직 동그란 말 연습 기록이 없어요.</p>'}
      </div>
      <div class="card"><h2>학생별 기록</h2><div class="scroll"><table><thead><tr><th>반</th><th>번호</th><th>표시</th><th>기분 전→후</th><th>공감 전→후</th><th>동그란 말</th><th>소감</th></tr></thead><tbody>
        ${rows.map(({ a, b, m, r }) => `<tr><td>${esc(r.classNo)}</td><td class="n">${r.studentNo}</td><td>${esc(r.displayName || '')}</td><td>${moodE(a && a.mood)} → ${moodE(b && b.mood)}</td><td class="n">${a ? scoreOf(a).toFixed(1) : '–'} → ${b ? scoreOf(b).toFixed(1) : '–'}</td><td class="n">${m ? m.score + '점' : '–'}</td><td>${esc(b ? b.note : '')}</td></tr>`).join('')}
      </tbody></table></div></div>`;
    if ($('#cls')) $('#cls').onchange = e => { cls = e.target.value === '전체' ? '전체' : e.target.value.replace('반', ''); renderStats(); };
    if ($('#print')) $('#print').onclick = () => print();
    if ($('#csv')) $('#csv').onclick = () => {
      const head = ['단계', '반', '번호', '표시', '기분(1~5)', '마음 낱말', ...ITEMS.map((_, i) => '문항' + (i + 1)), ...DOMAINS, '공감 평균', '동그란 말 점수', ...RW_RULES.map(r => r.name), ...RW.map((_, i) => '동그란 말 ' + (i + 1)), '소감', '시각'];
      const lines = [head, ...use.slice().sort((x, y) => ts(x) - ts(y)).map(r => r.phase === 'activity' ? [PHASE[r.phase], r.classNo, r.studentNo, r.displayName || '', '', '', ...ITEMS.map(() => ''), ...DOMAINS.map(() => ''), '', r.score, ...RW_RULES.map(x => (r.hits || {})[x.key] || 0), ...RW.map((_, i) => (r.answers || [])[i] || ''), '', new Date(ts(r)).toLocaleString('ko-KR')] : [PHASE[r.phase], r.classNo, r.studentNo, r.displayName || '', r.mood, r.moodWord || '', ...r.items, ...DOMAINS.map((_, i) => domainOf(r, i).toFixed(2)), scoreOf(r).toFixed(2), '', ...RW_RULES.map(() => ''), ...RW.map(() => ''), r.note || '', new Date(ts(r)).toLocaleString('ko-KR')])];
      const csv = '﻿' + lines.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `동그란말공감교실_${cur.title}.csv`; a.click();
    };
  }
}

/* =========================================================
   ⑤ 시작 화면
   ========================================================= */
function homeView() {
  app.innerHTML = `<div class="card"><h2>어떻게 들어오셨나요?</h2>
    <div class="row"><div><label for="code">학생 — 수업 코드</label><input id="code" maxlength="6" placeholder="예: K7P3QZ" style="text-transform:uppercase"></div><button id="join" style="flex:0 0 auto;align-self:flex-end">들어가기</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <button class="ghost" id="teach">선생님 화면으로</button></div>`;
  $('#join').onclick = () => { const c = $('#code').value.trim().toUpperCase(); if (c.length === 6) location.search = '?code=' + c; else modal('수업 코드 6글자를 적어 주세요.'); };
  $('#teach').onclick = () => { location.search = '?teacher'; };
}

(async () => {
  const qs0 = new URLSearchParams(location.search);
  try { DB = (FIREBASE_CONFIG && !qs0.has('demo')) ? await firebaseDB(FIREBASE_CONFIG) : demoDB(); }
  catch (e) { app.innerHTML = `<div class="card"><h2>연결하지 못했어요</h2><p>${esc(e.message)}</p><p class="muted">인터넷 연결과 Firebase 설정을 확인해 주세요.</p></div>`; return; }
  if (DB.demo) { const b = $('#banner'); b.classList.remove('hide'); b.innerHTML = '체험 모드 — 기록이 <b>이 기기 브라우저에만</b> 저장돼요. 같은 브라우저의 다른 탭에서 학생 화면(주소 끝에 &demo)을 열어 시험할 수 있어요.'; }
  const q = new URLSearchParams(location.search);
  const code = (q.get('code') || '').trim().toUpperCase();
  if (code) studentView(code); else if (q.has('teacher')) teacherView(); else homeView();
})();
</script>
</body>
